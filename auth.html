<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CampusFind — Authentication</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    :root {
      --bg: #0d0f14;
      --surface: #151820;
      --s2: #1c2030;
      --border: rgba(255, 255, 255, 0.07);
      --accent: #f5c542;
      --accent2: #e87c3e;
      --text: #e8eaf0;
      --muted: #7a8099;
      --r: 12px;
    }
    body {
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(245, 197, 66, .07) 0%, transparent 70%);
    }
    .auth-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .4);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.75rem;
      letter-spacing: -.02em;
      margin-bottom: 2rem;
      color: var(--text);
      text-decoration: none;
    }
    .brand-dot { color: var(--accent) }
    .toggle {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 0.3rem;
      margin-bottom: 1.5rem;
    }
    .toggle-btn {
      flex: 1;
      padding: 0.6rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      font-size: 0.9rem;
    }
    .toggle-btn.active {
      background: var(--s2);
      color: var(--text);
    }
    .form-group {
      margin-bottom: 1.1rem;
    }
    .form-group label {
      display: block;
      font-size: .75rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: .4rem;
      letter-spacing: .02em;
    }
    .form-group input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: .875rem;
      padding: .75rem .9rem;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
    }
    .form-group input:focus {
      border-color: rgba(245, 197, 66, .4);
    }
    .submit-btn {
      width: 100%;
      padding: .85rem;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      color: var(--bg);
      transition: all .2s;
      font-family: inherit;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(245, 197, 66, 0.25);
    }
    .error-msg {
      color: #ff5a5a;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: center;
      display: none;
      background: rgba(255, 90, 90, 0.1);
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 90, 90, 0.3);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <a href="Frontend.html" class="brand">CampusFind<span class="brand-dot">.</span></a>
    
    <div class="toggle">
      <button class="toggle-btn active" id="btn-login" onclick="switchTab('login')">Login</button>
      <button class="toggle-btn" id="btn-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <form id="auth-form" onsubmit="handleAuth(event)">
      <div class="form-group" id="name-group" style="display: none;">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="john@university.edu" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">Login</button>
    </form>
  </div>

  <script>
    let mode = 'login';
    const API_URL = window.location.protocol.startsWith('http') ? window.location.origin : 'http://127.0.0.1:8000';

    function switchTab(newMode) {
      mode = newMode;
      document.getElementById('btn-login').classList.toggle('active', mode === 'login');
      document.getElementById('btn-signup').classList.toggle('active', mode === 'signup');
      document.getElementById('name-group').style.display = mode === 'signup' ? 'block' : 'none';
      document.getElementById('submit-btn').innerText = mode === 'signup' ? 'Sign Up' : 'Login';
      document.getElementById('name').required = mode === 'signup';
      document.getElementById('error-msg').style.display = 'none';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value;
      
      const endpoint = mode === 'login' ? '/login' : '/signup';
      const body = mode === 'login' ? { email, password } : { name, email, password };

      try {
        const res = await fetch(`${API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.detail || 'Authentication failed');
        }

        // Store user info
        localStorage.setItem('user', JSON.stringify(data));
        window.location.href = 'Frontend.html';
      } catch (err) {
        const errEl = document.getElementById('error-msg');
        errEl.innerText = err.message;
        errEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
